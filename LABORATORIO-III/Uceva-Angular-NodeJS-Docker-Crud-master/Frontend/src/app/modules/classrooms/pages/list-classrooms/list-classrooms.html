<div class="d-flex justify-content-between align-items-center">
    <div>
        <h3 class="fw-bold mb-0">Aulas</h3>
        <small class="text-muted">Gestión de aulas</small>
    </div>
    <app-button [config]="createButtonConfig" (onClick)="createClassroom()" />
</div>

<div class="mt-3">
    @if (loading) {
        <div class="text-center py-5">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Cargando...</span>
            </div>
        </div>
    } @else if (hasError) {
        <div class="alert alert-danger d-flex justify-content-between align-items-center">
            <span><i class="bi bi-exclamation-octagon me-2"></i>No fue posible cargar la información desde el servidor.</span>
            <button type="button" class="btn btn-sm btn-outline-danger" (click)="getClassrooms()">Reintentar</button>
        </div>
    } @else {
        <app-table-classrooms [classrooms]="classrooms" (onClickActions)="tableEvents($event)" />
    }
</div>
